# ============================================
# Configuración base - Sistema de Gestión Documental
# Estándar: PAS-EST-043
# ============================================
# Perfiles: dev (desarrollo) | calidad | prod (producción)
# Activar: -Dquarkus.profile=calidad o QUARKUS_PROFILE=prod
# Por defecto se usa "dev" en desarrollo local.
quarkus.profile=dev

# Información de la aplicación (común a todos los ambientes)
quarkus.application.name=gestion-documental-backend
quarkus.application.version=1.0.0-SNAPSHOT

# OpenAPI/Swagger (título común; habilitación por perfil)
quarkus.smallrye-openapi.info-title=Sistema de Gestión Documental API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API del Sistema de Gestión Documental del IESS - Backend Quarkus siguiendo el estándar PAS-EST-043
quarkus.smallrye-openapi.path=/openapi
# Evita que quarkus-oidc inyecte openIdConnect con todos los flujos Keycloak en Swagger.
# Esquema Bearer JWT para pegar token manualmente (ver GestionDocumentalApplication).
quarkus.smallrye-openapi.auto-add-security=false
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=BearerAuth
quarkus.smallrye-openapi.jwt-bearer-format=JWT
quarkus.smallrye-openapi.security-scheme-description=JWT de Keycloak (realm plantilla-front). Obtenerlo tras login en Shell/MFE desde DevTools Network o BFF access-token.

# Swagger UI (path común; always-include por perfil)
quarkus.swagger-ui.path=/swagger-ui

# Health Checks (común)
quarkus.smallrye-health.ui.enable=true

# Hibernate ORM (común)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.dialect.OracleDialect

# Flyway (común; habilitación por perfil si se requiere)
quarkus.flyway.enabled=false
quarkus.flyway.migrate-at-start=false
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# Compresión HTTP (Fase 4 — reduce payload JSON hacia el MFE)
quarkus.http.enable-compression=true

# Cache de catálogos — Caffeine, TTL 10 min (Fase 3)
quarkus.cache.caffeine."catalogo-secciones".expire-after-write=10M
quarkus.cache.caffeine."catalogo-detalles".expire-after-write=10M
quarkus.cache.caffeine."catalogo-bootstrap".expire-after-write=10M

# Connection pool (valores base; cada perfil puede sobreescribir)
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.datasource.jdbc.background-validation-interval=PT10M
quarkus.datasource.jdbc.idle-removal-interval=PT10M
quarkus.datasource.jdbc.max-lifetime=PT1H
quarkus.datasource.jdbc.validation-query-sql=SELECT 1 FROM DUAL

# Logging base: INFO. Perfil dev → DEBUG para ec.gob.iess (ver application-dev.properties);
# prod → WARN para ec.gob.iess (ver application-prod.properties). Fase 1 – observabilidad.
quarkus.log.level=INFO

# ========================================================
# OIDC / Keycloak (PAS-EST-043) — valores por env; activación por perfil
# Variables: KEYCLOAK_AUTH_SERVER_URL, KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET
# ========================================================
quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:gestion-documental-api}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:}
quarkus.oidc.application-type=service
quarkus.oidc.authentication.user-info-required=false
quarkus.oidc.roles.source=accesstoken
# Roles SDNGD: claim custom IESS + realm_access (fallback Keycloak)
quarkus.oidc.roles.role-claim-path=user/rolesDisponibles
quarkus.oidc.roles.role-claim-path=user/rol
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.roles.role-claim-path=resource_access/plantilla-front-cliente/roles
# Token emitido al login en Shell/MFE (Keycloak: aud suele ser "account", azp = client-id front)
quarkus.oidc.token.audience=${KEYCLOAK_TOKEN_AUDIENCE:account}
quarkus.oidc.token.required-claims.azp=${KEYCLOAK_TOKEN_AZP:plantilla-front-cliente}
quarkus.http.auth.proactive=true

# CORS preflight sin Bearer
quarkus.http.auth.permission.cors-preflight.paths=/api/*
quarkus.http.auth.permission.cors-preflight.policy=permit
quarkus.http.auth.permission.cors-preflight.methods=OPTIONS

# Rutas públicas (health, OpenAPI)
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*,/openapi,/openapi/*,/swagger-ui,/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit

# API documental exige JWT (cuando OIDC está habilitado en el perfil)
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# Tests: sin Keycloak (ver src/test/resources/application.properties)
%test.quarkus.oidc.enabled=false
%test.quarkus.http.auth.permission.api.policy=permit
